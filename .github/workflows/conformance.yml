name: Conformance

# The family's validation gate (SDS-S-110) as CI: the conformance
# linter over every skill, the eval runner over every executable row,
# and the generated files (README, plugin manifests) checked against
# the registry. Everything here is offline — blocking eval rows never
# reach a live system (SDS-S-092), so no token beyond the default is
# needed and nothing is mutated.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the kit's dependencies
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Lint every skill (warnings fail)
        run: python kit/scripts/lint-skill.py --all skills --strict --no-review

      - name: Linter negative tests
        run: python kit/tests/test_lint_negative.py

      - name: Validate the registry
        run: |
          python - <<'EOF'
          import json, jsonschema
          reg = json.load(open("kit/registry/marketplace.json"))
          jsonschema.validate(reg, json.load(open("kit/registry/marketplace.schema.json")))
          print(f"registry OK: {len(reg['skills'])} skills, version {reg['version']}")
          EOF

      - name: Generated files match the registry
        run: |
          python kit/scripts/render_index.py --check
          python kit/scripts/render_plugin.py --check

      - name: Run every eval row
        run: python kit/scripts/run-evals.py --all skills

  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the kit's dependencies
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Run every eval row with the network removed
        run: sudo unshare -n sudo -u runner env PATH="$PATH" python kit/scripts/run-evals.py --all skills
