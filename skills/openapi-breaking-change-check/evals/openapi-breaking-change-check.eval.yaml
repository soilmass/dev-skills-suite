# Table-driven eval file for openapi-breaking-change-check (SDS-S-090).
#
# A rung-1 Query Skill over hand-written OpenAPI 3 documents: a v1, a
# v2 carrying one instance of each breaking change plus one additive
# operation, a v1 copy in YAML (same content, different syntax), and a
# malformed file. Every row is deterministic and offline.

skill: openapi-breaking-change-check

rows:
  # REQUIRED — happy path (SDS-S-099): every planted break is reported at its pointer; the additive change is info.
  - name: happy-path-planted-breaks
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/openapi-v2.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "errors: api/operation-removed at paths./orders.post; api/param-required-added at paths./orders/{id}.get.parameters.expand; api/param-type-changed at paths./orders.get.parameters.limit (integer -> string); api/request-required-added at paths./orders/{id}.patch.requestBody.reason; api/response-property-removed at paths./orders/{id}.get.responses.200.total AND at paths./orders.get.responses.200.items.total (the list endpoint returns the same Order schema, so its clients break too); api/response-type-changed at both .amount pointers (number -> string)"
        - "warnings: api/param-removed at paths./orders.get.parameters.page; api/response-removed at paths./orders/{id}.get.responses.404; api/enum-value-removed at paths./orders/{id}.get.responses.200.status and at paths./orders.get.responses.200.items.status, each with removed [shipped]"
        - "info: api/operation-added at paths./orders/{id}/refunds.post; no finding for the unchanged customers path"
        - "tool.properties: oldVersion 1.4.0, newVersion 2.0.0, breaking 8; errors before warnings before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted removed response property is found at its pointer.
  - name: mutation-fixture-response-property-removed
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/openapi-v2.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "an api/response-property-removed result exists with properties.pointer paths./orders/{id}.get.responses.200.total, level error"
        - "output validates against kit/shapes/finding-list.schema.json"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): identical documents -> empty results.
  - name: boundary-empty-identical-documents
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/openapi-v1.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.breaking is 0"

  # The same content in YAML compares equal to the JSON: syntax is not a change.
  - name: boundary-yaml-equals-json
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/openapi-v1.yaml"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array"

  # Reversed direction: v2 -> v1 is also breaking, differently — the added path becomes a whole-path removal, the retyped fields flip back (still a type change), and un-requiring parameters or properties draws nothing.
  - name: boundary-reverse-direction
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v2.json evals/fixtures/openapi-v1.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "api/path-removed at paths./orders/{id}/refunds (the path itself is gone, so no per-operation finding); api/operation-added at paths./orders.post; api/param-type-changed and both api/response-type-changed findings reappear (string -> number is still a change); no api/response-property-removed, no api/param-required-added, no api/request-required-added"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-document
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/openapi-malformed.json"
    expected:
      kind: failure
      failureCode: spec-unparseable
      assertions:
        - "exit code is 1 and stderr says spec-unparseable"

  - name: boundary-not-openapi
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/not-openapi.json"
    expected:
      kind: failure
      failureCode: spec-invalid
      assertions:
        - "exit code is 1 — valid JSON without openapi/paths — and stderr says spec-invalid"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/diff_openapi.py evals/fixtures/openapi-v1.json evals/fixtures/openapi-v2.json | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
