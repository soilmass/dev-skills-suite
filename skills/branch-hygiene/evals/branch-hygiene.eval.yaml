# Table-driven eval file for branch-hygiene (SDS-S-090).
#
# A rung-2 Query Skill. Rows run against a generated git fixture with
# pinned commit dates (build-branch-fixtures.sh) and, for the
# injectable path (SDS-S-065), a facts file with a branch that is both
# stale and gone. Every row passes --as-of so staleness never depends
# on the day the suite runs (SDS-C-003).
#
# Before running: the git fixture is generated, not checked in.
#   evals/fixtures/build-branch-fixtures.sh

skill: branch-hygiene

rows:
  # REQUIRED — happy path (SDS-S-099): the generated repository scans as predicted.
  - name: happy-path-scan-fixture-repo
    input:
      command: "evals/fixtures/build-branch-fixtures.sh && python3 scripts/scan_branches.py evals/fixtures/hygiene-work --base main --as-of 2026-09-06"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "exactly one branch/merged (feature/merged), one branch/stale (feature/stale, ageDays 234), one branch/gone-upstream (feature/gone); feature/active and main produce nothing"
        - "warnings are ordered before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted stale branch is found with its age.
  - name: mutation-fixture-planted-stale-branch
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/branches-facts.json --as-of 2026-09-06"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "a branch/stale result exists for feature/stale with properties.ageDays 234, merged false, level warning"
        - "output validates against kit/shapes/finding-list.schema.json"

  # Happy path: a branch can carry two findings (stale AND gone).
  - name: happy-path-stale-and-gone
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/branches-facts.json --as-of 2026-09-06"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "hotfix/stale-and-gone appears twice: branch/stale (warning) and branch/gone-upstream (info)"
        - "main is skipped even though merged is true"

  # Happy path: a larger stale threshold silences the stale findings but not the merged/gone ones.
  - name: happy-path-threshold
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/branches-facts.json --as-of 2026-09-06 --stale-days 400"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "no branch/stale results; branch/merged and both branch/gone-upstream results remain"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): nothing merged, stale, or gone -> empty results.
  - name: boundary-none-only-active-branches
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/branches-facts.json --as-of 2026-01-16 --stale-days 400"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "as of 2026-01-16 with a 400-day threshold nothing is stale; only merged and gone findings can remain — assert branch/stale is absent"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-facts
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/facts-malformed.json --as-of 2026-09-06"
    expected:
      kind: failure
      failureCode: facts-unparseable
      assertions:
        - "exit code is 1 and stderr says facts-unparseable"

  - name: boundary-invalid-repo-root
    input:
      command: "python3 scripts/scan_branches.py evals/fixtures --as-of 2026-09-06"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — evals/fixtures is inside a repository but is not its root"

  - name: boundary-bad-as-of
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/branches-facts.json --as-of yesterday"
    expected:
      kind: failure
      failureCode: bad-argument
      assertions:
        - "exit code is 1 and stderr says bad-argument"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/scan_branches.py . --facts-file evals/fixtures/branches-facts.json --as-of 2026-09-06 | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
