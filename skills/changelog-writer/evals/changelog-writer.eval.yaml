# Table-driven eval file for changelog-writer (SDS-S-090).
#
# A rung-4 Command Skill whose only mutation is inserting an entry into
# CHANGELOG.md, so the Act path runs for real against a gitignored copy
# of a planted changelog, reset by a build script (SDS-S-096). Commit
# collection is exercised through --log-file (SDS-S-065) with planted
# Conventional Commits logs, so no row needs a repository or a tag.
#
# Before running: evals/fixtures/cl-out is generated, not checked in.
#   evals/fixtures/build-cl-out.sh

skill: changelog-writer

rows:
  # REQUIRED — happy path (SDS-S-099): eight planted commits categorize as predicted.
  - name: happy-path-collect
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt"
    expected:
      kind: success
      shape: status-report
      assertions:
        - "sections, in Keep a Changelog order, are Added (2 lines), Changed (1), Deprecated (1), Fixed (1), Security (1) — no Uncategorized"
        - "the Added line for 'drop Python 3.8 support' is prefixed **BREAKING:** (bang plus BREAKING CHANGE footer)"
        - "the fix(security) commit landed under Security, not Fixed; docs and chore commits are absent"
        - "summary reads '2 added, 1 changed, 1 deprecated, 1 fixed, 1 security since log-file:...'"

  # Happy path: non-conventional messages are kept as Uncategorized, never dropped.
  - name: happy-path-uncategorized-kept
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-nonconventional.txt"
    expected:
      kind: success
      shape: status-report
      assertions:
        - "sections are Added (1: add export command) and Uncategorized (2: 'Update stuff', 'WIP')"

  # Happy path: --include-all files chore/docs under Changed.
  - name: happy-path-include-all
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt --include-all"
    expected:
      kind: success
      shape: status-report
      assertions:
        - "Changed now has 3 lines (perf + docs + chore(ci))"

  # Happy path: dry-run render places the entry above the existing [1.1.0] and preserves the rest.
  - name: happy-path-render-dry-run
    input:
      command: "evals/fixtures/build-cl-out.sh && python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt > evals/fixtures/cl-out/report.json && python3 scripts/render_changelog.py evals/fixtures/cl-out/report.json --changelog evals/fixtures/cl-out/CHANGELOG.md --version 1.2.0 --date 2026-09-06 --dry-run"
    expected:
      kind: success
      shape: status-report
      assertions:
        - "entry begins '## [1.2.0] - 2026-09-06' and contains '### Added' through '### Security'"
        - "content has the new entry before '## [1.1.0]' and the [1.0.0] entry intact; the file on disk is unchanged (dry run)"

  # Happy path: real write.
  - name: happy-path-write-entry
    input:
      command: "evals/fixtures/build-cl-out.sh && python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt > evals/fixtures/cl-out/report.json && python3 scripts/render_changelog.py evals/fixtures/cl-out/report.json --changelog evals/fixtures/cl-out/CHANGELOG.md --version 1.2.0 --date 2026-09-06"
    expected:
      kind: success
      shape: status-report
      assertions:
        - "evals/fixtures/cl-out/CHANGELOG.md's first '## ' heading is '## [1.2.0] - 2026-09-06' and the intro paragraph above it is unchanged"
        - "the original [1.1.0] and [1.0.0] entries are present byte for byte"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): no commits -> a status-report with no sections.
  - name: boundary-empty-log
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-empty.txt"
    expected:
      kind: success
      shape: status-report
      assertions:
        - "sections is an empty array and summary begins 'no changes'; the document is schema-valid"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-report
    input:
      command: "python3 scripts/render_changelog.py evals/fixtures/report-malformed.json --changelog evals/fixtures/changelog-existing.md --version 9.9.9 --dry-run"
    expected:
      kind: failure
      failureCode: report-unparseable
      assertions:
        - "exit code is 1 and stderr says report-unparseable"

  - name: boundary-invalid-version-exists
    input:
      command: "evals/fixtures/build-cl-out.sh && python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt > evals/fixtures/cl-out/report.json && python3 scripts/render_changelog.py evals/fixtures/cl-out/report.json --changelog evals/fixtures/cl-out/CHANGELOG.md --version 1.1.0 --dry-run"
    expected:
      kind: failure
      failureCode: version-exists
      assertions:
        - "exit code is 1 — [1.1.0] already has an entry; a changelog is append-only"

  - name: boundary-missing-changelog
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt > evals/fixtures/cl-out/report.json && python3 scripts/render_changelog.py evals/fixtures/cl-out/report.json --changelog evals/fixtures/cl-out/NOPE.md --version 1.2.0 --dry-run"
    expected:
      kind: failure
      failureCode: changelog-missing
      assertions:
        - "exit code is 1 and stderr says changelog-missing"

  - name: boundary-missing-log-file
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/cl-out/no-such-log.txt"
    expected:
      kind: failure
      failureCode: log-unreadable
      assertions:
        - "exit code is 1 and stderr says log-unreadable"

  # N/A — shape-out is status-report, not finding-list (SDS-S-095).
  - name: mutation-fixture
    expected:
      kind: not-applicable
      reason: "changelog-writer does not search for known problems; shape-out is status-report, not finding-list."

  # N/A — shape-out status-report != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out status-report differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): the report validates against the family shape that release-notes-writer will consume.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/collect_commits.py . --log-file evals/fixtures/git-log-sample.txt | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/status-report.schema.json'))); print('status-report OK', len(d['sections']), 'sections')\""
    expected:
      kind: success
      shape: status-report
      assertions:
        - "the actual output validates against kit/shapes/status-report.schema.json"
