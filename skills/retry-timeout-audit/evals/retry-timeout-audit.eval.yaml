# Table-driven eval file for retry-timeout-audit (SDS-S-090).
#
# A rung-1 Query Skill over a planted tree carrying one instance of each
# shape — a bare call with no timeout, a client constructed without one,
# a client constructed with one (silent), a constant-sleep retry loop, a
# while-True retry with a broad handler, a subprocess without timeout —
# beside a well-formed module that must stay silent. Every row is
# deterministic and offline; nothing is called.

skill: retry-timeout-audit

rows:
  # REQUIRED — happy path (SDS-S-099): every planted shape is reported at its line; the safe module draws nothing.
  - name: happy-path-planted-calls
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/planted-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "app/fetch.py: net/no-timeout for requests.get (line 6) and for the client method s.post (line 11, client constructed without timeout); no finding for cl.get (line 16, httpx.Client(timeout=5)) or for requests.post with timeout (line 20)"
        - "app/poll.py: net/constant-backoff (loop at line 7, one literal sleep), net/unbounded-retry (while True, broad except, no break, line 7), net/broad-retry (line 7); app/bounded.py: net/constant-backoff only — its for-loop is bounded and its handler is narrow, so no unbounded or broad finding"
        - "app/run.py: net/subprocess-no-timeout for subprocess.run (line 5); app/safe.py draws nothing; tool.properties.networkCalls 7, withTimeout 5; warnings before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted unbounded retry is found at its loop.
  - name: mutation-fixture-unbounded-retry
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/planted-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "a net/unbounded-retry result exists at app/poll.py line 7 with a broad handler in properties.handlers, level warning"
        - "output validates against kit/shapes/finding-list.schema.json"

  # A team wrapper is recognised only when named in the patterns: with the custom patterns file, http_client.fetch counts.
  - name: boundary-custom-patterns
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/planted-src --patterns evals/fixtures/patterns-with-wrapper.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "an additional net/no-timeout appears for http_client.fetch in app/wrapper_user.py; tool.properties.networkCalls is 8"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): no network calls -> empty results, calls 0.
  - name: boundary-empty-no-network-calls
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/no-network-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.networkCalls is 0"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-source
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/broken-src"
    expected:
      kind: failure
      failureCode: source-unparseable
      assertions:
        - "exit code is 1 and stderr names broken.py and says source-unparseable"

  - name: boundary-invalid-patterns
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/planted-src --patterns evals/fixtures/planted-src/app/safe.py"
    expected:
      kind: failure
      failureCode: patterns-invalid
      assertions:
        - "exit code is 1 and stderr says patterns-invalid"

  - name: boundary-invalid-path
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/planted-src/app/safe.py"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the path is a file, not a directory"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/audit_network_calls.py evals/fixtures/planted-src | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
