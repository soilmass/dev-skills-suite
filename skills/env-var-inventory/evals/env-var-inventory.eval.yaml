# Table-driven eval file for env-var-inventory (SDS-S-090).
#
# A rung-1 Query Skill over a planted tree — a Python module and a
# JavaScript module reading variables in every shape the script
# recognises — with a .env.example that documents some of them, leaves
# one blank, and lists one stale key; plus a consistent tree that must
# stay silent. Every row is deterministic and offline.

skill: env-var-inventory

rows:
  # REQUIRED — happy path (SDS-S-099): exactly the planted discrepancies are reported, with the inventory.
  - name: happy-path-planted-tree
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/planted-repo"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "env/undocumented names exactly LOG_LEVEL (Python, default info), FEATURE_FLAGS (JS, ?? default) and SENTRY_DSN (JS, no default) — DATABASE_URL, STRIPE_API_KEY, PORT and API_BASE are documented"
        - "env/unused names exactly REDIS_URL (documented, read nowhere); env/secret-with-default names exactly STRIPE_API_KEY with default sk_test_123; env/required-no-example names exactly DATABASE_URL (every read required, example line blank)"
        - "tool.properties.exampleFile is .env.example; variables lists DATABASE_URL with reads 2 across app/db.py and server.js, required true, documented true, exampleValueSet false; PORT with hasDefault true (JS || default)"
        - "warnings are ordered before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted fallback credential is found at its line.
  - name: mutation-fixture-secret-default
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/planted-repo"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "an env/secret-with-default result exists at app/payments.py line 9 with properties.variable STRIPE_API_KEY and default sk_test_123, level warning"
        - "output validates against kit/shapes/finding-list.schema.json"

  # No example file at all: everything read is undocumented, nothing is unused.
  - name: boundary-no-example-file
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/planted-repo --example evals/fixtures/planted-repo/.env.empty"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "every variable read appears as env/undocumented (7 of them); no env/unused; tool.properties.documented is empty"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): a consistent tree -> empty results with the inventory intact.
  - name: boundary-empty-findings-consistent-tree
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/consistent-repo"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.variables has 2 entries, both documented with example values"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-source
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/broken-repo"
    expected:
      kind: failure
      failureCode: source-unparseable
      assertions:
        - "exit code is 1 and stderr names broken.py and says source-unparseable"

  - name: boundary-unreadable-example
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/planted-repo --example evals/fixtures/planted-repo/app"
    expected:
      kind: failure
      failureCode: example-unreadable
      assertions:
        - "exit code is 1 — a directory cannot be read as the example file — and stderr says example-unreadable"

  - name: boundary-invalid-path
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/planted-repo/server.js"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the path is a file, not a directory"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/inventory_env_vars.py evals/fixtures/planted-repo | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
