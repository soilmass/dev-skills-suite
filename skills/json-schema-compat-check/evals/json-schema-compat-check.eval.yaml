# Table-driven eval file for json-schema-compat-check (SDS-S-090).
#
# A rung-1 Query Skill over hand-written JSON Schemas: an event schema
# v1, a v2 carrying one instance of each backward-incompatible change
# plus one relaxation and one enum addition, a v3 that is purely
# relaxing, a YAML copy of v1, and malformed files. Every row is
# deterministic and offline.

skill: json-schema-compat-check

rows:
  # REQUIRED — happy path (SDS-S-099): every planted break is reported at its pointer with the right level.
  - name: happy-path-planted-breaks
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/order-placed-v2.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "errors: schema/required-added at #.currency (new false) and #.trace_id (new true); schema/property-removed at #.notes (rejected true — v2 closes additionalProperties); schema/additional-properties-closed at #; schema/type-narrowed at #.total (number -> integer); schema/enum-value-removed at #.status (removed [shipped]); schema/constraint-tightened at #.lines (minItems introduced), #.lines.items.sku (pattern introduced), #.customer.email (format introduced)"
        - "warning: schema/enum-value-added at #.status (added [refunded]); info: schema/required-removed at #.placed_at, schema/type-widened at #.customer.id (integer -> [integer, string])"
        - "no finding for the unchanged #.lines.items.qty; tool.properties.backwardCompatible is false, breaking 9; errors before warnings before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted required addition is found at its pointer.
  - name: mutation-fixture-required-added
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/order-placed-v2.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "a schema/required-added result exists with properties.pointer #.currency, level error"
        - "output validates against kit/shapes/finding-list.schema.json"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): identical schemas -> empty results, backwardCompatible true.
  - name: boundary-empty-identical-schemas
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/order-placed-v1.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.backwardCompatible is true, breaking 0"

  # A purely relaxing change is backward compatible with informational findings only.
  - name: boundary-relaxing-change
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/order-placed-v3.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "every result is level info (schema/required-removed at #.status, schema/constraint-loosened at #.total maximum removed); backwardCompatible is true"

  # YAML syntax is not a change.
  - name: boundary-yaml-equals-json
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/order-placed-v1.yaml"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-schema
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/schema-malformed.json"
    expected:
      kind: failure
      failureCode: schema-unparseable
      assertions:
        - "exit code is 1 and stderr says schema-unparseable"

  - name: boundary-not-a-schema
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/not-a-schema.json"
    expected:
      kind: failure
      failureCode: schema-invalid
      assertions:
        - "exit code is 1 — valid JSON with no schema keywords — and stderr says schema-invalid"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/diff_json_schema.py evals/fixtures/order-placed-v1.json evals/fixtures/order-placed-v2.json | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
