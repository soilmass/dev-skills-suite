# Table-driven eval file for report-poster (SDS-S-090).
#
# A rung-5 Command Skill whose shape-in and shape-out are the SAME
# registered shape (status-report), so the fixed-point row (SDS-S-094)
# is required as a real, passing test, as release-notes-writer's is.
# The renderer is exercised entirely offline against frozen producer
# output; the checkpoint store runs against the gitignored
# evals/fixtures/state-scratch/ (reset by build-state-scratch.sh,
# SDS-S-096). The mutation — gh pr comment / gh issue comment — is
# never run by this suite in any capacity (SDS-S-092).

skill: report-poster

rows:
  # REQUIRED — happy path (SDS-S-099): findings-digest's real six-section
  # report renders as a comment for pull request #7.
  - name: happy-path-digest-report
    input:
      command: "python3 scripts/render_report_comment.py evals/fixtures/frozen-findings-digest-report.json --target pr:7"
    expected:
      kind: success
      assertions:
        - "target is {\"kind\": \"pr\", \"number\": 7}"
        - "body contains exactly six '### ' headings: Totals, By tool, By level, Top rules, Files with most findings, Errors"
        - "body's footer line is '_Generated from: evals/fixtures/frozen-dependency-audit-findings.json, evals/fixtures/frozen-ci-pipeline-audit-findings.json, evals/fixtures/frozen-retry-timeout-audit-findings.json_'"
        - "the marker '<!-- sds-report: f703ccbadf10 -->' is the last line of body, and marker equals that same string"

  # REQUIRED — boundary: a report with no sections (SDS-C-005, SDS-C-033) renders a summary-only body plus the marker.
  - name: boundary-empty-sections
    input:
      command: "python3 scripts/render_report_comment.py evals/fixtures/report-empty-sections.json --target issue:5"
    expected:
      kind: success
      assertions:
        - "target is {\"kind\": \"issue\", \"number\": 5}"
        - "body is exactly '## Nothing to report\\n\\n<!-- sds-report: f5a637211cc6 -->' — no '### ' heading appears"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast) — not a status-report at all.
  - name: boundary-malformed-report
    input:
      command: "python3 scripts/render_report_comment.py evals/fixtures/report-malformed.json --target pr:7"
    expected:
      kind: failure
      failureCode: report-invalid
      assertions:
        - "exit code is 1 and stderr says report-invalid, naming the missing 'summary' property"

  # REQUIRED — boundary: an invalid --target is rejected before or independent of the report's validity.
  - name: boundary-invalid-target
    input:
      command: "python3 scripts/render_report_comment.py evals/fixtures/frozen-findings-digest-report.json --target branch:1"
    expected:
      kind: failure
      failureCode: target-invalid
      assertions:
        - "exit code is 1 and stderr says target-invalid — 'branch:1' matches neither pr:<n> nor issue:<n>"
        - "pr:0 is rejected the same way: n must be >= 1"

  # An explicit --marker overrides the hash default verbatim.
  - name: boundary-explicit-marker
    input:
      command: "python3 scripts/render_report_comment.py evals/fixtures/frozen-findings-digest-report.json --target pr:7 --marker abc123"
    expected:
      kind: success
      assertions:
        - "marker is exactly '<!-- sds-report: abc123 -->', and it is still the last line of body"

  # Boundary: a directory in place of a file is unreadable, not merely absent.
  - name: boundary-missing-file
    input:
      command: "python3 scripts/render_report_comment.py evals/fixtures --target pr:7"
    expected:
      kind: failure
      failureCode: report-invalid
      assertions:
        - "exit code is 1 and stderr says report-invalid — evals/fixtures is a directory, not a status-report file"

  # Checkpoint round trip (SDS-S-053): pending before, completed after, for the pr-7-comment step.
  - name: happy-path-checkpoint-round-trip
    input:
      command: >-
        evals/fixtures/build-state-scratch.sh &&
        python3 scripts/checkpoint.py report-poster pr-7 --step pr-7-comment --status pending
          --compensating-action "rung-6 comment delete, not run by this skill" --state-dir evals/fixtures/state-scratch &&
        python3 scripts/checkpoint.py report-poster pr-7 --step pr-7-comment --status completed --state-dir evals/fixtures/state-scratch &&
        python3 scripts/checkpoint.py report-poster pr-7 --show --state-dir evals/fixtures/state-scratch
    expected:
      kind: success
      assertions:
        - "the record at evals/fixtures/state-scratch/report-poster/pr-7.json has one step, pr-7-comment, status completed, with startedAt, completedAt, and the compensating action"

  # N/A — this skill posts a report as a comment; it does not search for known problems, so there is no finding-list to plant a mutation into.
  - name: mutation-fixture
    expected:
      kind: not-applicable
      reason: "report-poster does not search for known problems; shape-out is status-report, not finding-list."

  # REQUIRED — fixed-point (SDS-S-094, SDS-C-017): shape-in == shape-out == status-report, so the skill is
  # genuinely self-composable. Render a producer's real report, then render a status-report shaped like
  # this skill's own Persist output ("posted comment on pr 7") — both are valid payloads, and rendering
  # the Persist report twice yields byte-identical output (the renderer has no hidden state; only an
  # explicit --marker or the hash of generatedFrom/summary — both fixed given the same input — govern it).
  - name: fixed-point
    input:
      command: "python3 -c \"import subprocess,json,tempfile,os; a=['python3','scripts/render_report_comment.py']; p1=subprocess.run(a+['evals/fixtures/frozen-findings-digest-report.json','--target','pr:7'],capture_output=True,text=True,check=True).stdout; payload1=json.loads(p1); assert set(payload1.keys())=={'target','marker','body'}; persist={'summary':'posted comment on pr 7','sections':[{'heading':'Posted','body':'Posted the findings-digest report as a comment on pr #7 with marker f703ccbadf10.'}],'generatedFrom':'evals/fixtures/frozen-findings-digest-report.json'}; f=tempfile.NamedTemporaryFile('w',suffix='.json',delete=False); f.write(json.dumps(persist)); f.close(); r1=subprocess.run(a+[f.name,'--target','issue:12'],capture_output=True,text=True,check=True).stdout; r2=subprocess.run(a+[f.name,'--target','issue:12'],capture_output=True,text=True,check=True).stdout; os.unlink(f.name); assert r1==r2, 'second render of the Persist report differs'; payload2=json.loads(r1); assert set(payload2.keys())=={'target','marker','body'}; print('fixed point holds; both renders are valid payloads')\""
    expected:
      kind: success
      assertions:
        - "rendering the producer's frozen digest report yields a valid {target, marker, body} payload"
        - "rendering a status-report built from this skill's own Persist shape ('posted comment on pr 7') also yields a valid payload"
        - "rendering that Persist report twice is byte-identical — the fixed point holds"

  # REQUIRED — contract (SDS-C-063): both frozen producer reports this suite feeds in validate against
  # status-report, this skill's shape-in, and both render without error — the shape graph's promise that
  # any status-report can reach this skill.
  - name: contract-with-upstream-producers
    input:
      command: "python3 -c \"import json,jsonschema,subprocess; schema=json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/status-report.schema.json')); files=[('evals/fixtures/frozen-findings-digest-report.json','pr:7'),('evals/fixtures/frozen-changelog-writer-report.json','issue:9')]; [jsonschema.validate(json.load(open(f)), schema) for f,_ in files]; outs=[subprocess.run(['python3','scripts/render_report_comment.py',f,'--target',t],capture_output=True,text=True,check=True).stdout for f,t in files]; payloads=[json.loads(o) for o in outs]; assert all(set(p.keys())=={'target','marker','body'} for p in payloads); print('both frozen reports validate against status-report and both render')\""
    expected:
      kind: success
      assertions:
        - "findings-digest's frozen report and release-notes-writer's frozen changelog-writer report both validate against kit/shapes/status-report.schema.json"
        - "both render into a valid {target, marker, body} payload without error"

---
# Non-executed by design: gh pr comment / gh issue comment is never run
# by this suite (SDS-S-092). A live, read-only smoke check of the
# check-before-act read this skill's Act stage uses:
#   gh pr view <n> -R <owner>/<repo> --json comments
# requires gh auth against a real repository and is not a gate.
