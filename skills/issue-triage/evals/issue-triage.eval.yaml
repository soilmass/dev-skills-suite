# Table-driven eval file for issue-triage (SDS-S-090).
#
# A rung-5 Command Skill. The proposal script is exercised offline
# through --issues-json-file fixtures in `gh issue list --json` shape
# with an injected --as-of clock (SDS-S-064, SDS-S-065); the checkpoint
# store runs against the gitignored evals/fixtures/state-scratch/
# (reset by build-state-scratch.sh, SDS-S-096). The mutations — gh
# issue edit --add-label, gh issue comment — are never run by this
# suite in any capacity (SDS-S-092).

skill: issue-triage

rows:
  # REQUIRED — happy path (SDS-S-099): the planted issues produce exactly the expected labels and comments; the triaged one is skipped.
  - name: happy-path-planted-issues
    input:
      command: "python3 scripts/propose_triage.py . --issues-json-file evals/fixtures/issues-open.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: success
      shape: plan-doc
      assertions:
        - "goal says 4 untriaged issue(s), 1 already triaged (#14 carries kind/docs)"
        - "label phase: #12 kind/bug + priority/high; #13 kind/feature; #15 kind/question; #16 kind/needs-info — in issue order"
        - "comment phase: #12 asks for reproduction steps (short body, no repro); #16 asks what kind it is; #15 gets the stale nudge (updated 2026-05-01, no comments, 127 days); no comment on #13 (updated recently)"
        - "every step has a rollback; label rollbacks are gh issue edit N --remove-label; comment rollbacks name the rung-6 API delete; the label phase precedes the comment phase"

  # Stale threshold is a parameter: with 200 days nothing is stale.
  - name: boundary-stale-threshold
    input:
      command: "python3 scripts/propose_triage.py . --issues-json-file evals/fixtures/issues-open.json --as-of 2026-09-05T12:00:00Z --stale-days 200"
    expected:
      kind: success
      shape: plan-doc
      assertions:
        - "no comment step mentions 'no activity'; the other comments are unchanged"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): every issue triaged -> a valid 'nothing to do' plan.
  - name: boundary-all-triaged
    input:
      command: "python3 scripts/propose_triage.py . --issues-json-file evals/fixtures/issues-triaged.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: success
      shape: plan-doc
      assertions:
        - "phases has one entry named 'nothing to do' with one low-risk step whose rollback says none needed; goal says 0 untriaged, 2 already triaged"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-issues
    input:
      command: "python3 scripts/propose_triage.py . --issues-json-file evals/fixtures/issues-malformed.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: failure
      failureCode: issues-unparseable
      assertions:
        - "exit code is 1 and stderr says issues-unparseable"

  - name: boundary-missing-as-of
    input:
      command: "python3 scripts/propose_triage.py . --issues-json-file evals/fixtures/issues-open.json"
    expected:
      kind: failure
      failureCode: as-of-invalid
      assertions:
        - "exit code is 1 and stderr says --as-of is required with a fixture (as-of-invalid)"

  - name: boundary-invalid-repo-path
    input:
      command: "python3 scripts/propose_triage.py evals/fixtures/issues-open.json --issues-json-file evals/fixtures/issues-open.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the repository path is a file"

  # Checkpoint round trip (SDS-S-053): pending before, completed after, per label step.
  - name: happy-path-checkpoint-round-trip
    input:
      command: >-
        evals/fixtures/build-state-scratch.sh &&
        python3 scripts/checkpoint.py issue-triage 2026-09-05 --step 12-label-kind-bug --status pending
          --compensating-action "gh issue edit 12 --remove-label kind/bug" --state-dir evals/fixtures/state-scratch &&
        python3 scripts/checkpoint.py issue-triage 2026-09-05 --step 12-label-kind-bug --status completed --state-dir evals/fixtures/state-scratch &&
        python3 scripts/checkpoint.py issue-triage 2026-09-05 --show --state-dir evals/fixtures/state-scratch
    expected:
      kind: success
      assertions:
        - "the record at evals/fixtures/state-scratch/issue-triage/2026-09-05.json has one step, 12-label-kind-bug, status completed, with startedAt and completedAt and the compensating action"

  # N/A — shape-out is status-report, not finding-list (SDS-S-095).
  - name: mutation-fixture
    expected:
      kind: not-applicable
      reason: "issue-triage does not search for known problems; shape-out is status-report."

  # N/A — shape-out status-report != shape-in plan-doc (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out status-report differs from shape-in plan-doc; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): the proposal, this skill's own shape-in, validates against the registered plan-doc shape.
  - name: contract-with-upstream-producer
    input:
      command: "python3 scripts/propose_triage.py . --issues-json-file evals/fixtures/issues-open.json --as-of 2026-09-05T12:00:00Z | python3 -c \"import json,sys,jsonschema; jsonschema.validate(json.load(sys.stdin), json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/plan-doc.schema.json'))); print('plan-doc OK')\""
    expected:
      kind: success
      shape: plan-doc
      assertions:
        - "the actual proposal validates against kit/shapes/plan-doc.schema.json"

---
# Non-executed by design: gh issue edit --add-label and gh issue comment
# are never run by this suite (SDS-S-092). A live, read-only smoke check
# of the proposal (asserting SHAPE only):
#   python3 scripts/propose_triage.py . --limit 20 | python3 -c "import json,sys,jsonschema; jsonschema.validate(json.load(sys.stdin), json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/plan-doc.schema.json')))"
# requires gh auth against a real repository and is not a gate.
