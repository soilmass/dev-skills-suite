# Table-driven eval file for log-taxonomy-designer (SDS-S-090).
#
# A rung-1 Query Skill over a planted tree with one logging call per
# drift pattern beside a clean module whose consistent, constant-template
# calls must stay silent. Every row is deterministic and offline.

skill: log-taxonomy-designer

rows:
  # REQUIRED — happy path (SDS-S-099): exactly the planted drift is reported, with the inventory.
  - name: happy-path-planted-drift
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/planted-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "log/inconsistent-field-name fires once, for canonical user.id with variants user_id 2, userId 1, uid 1; no finding for order.id, which is always order_id"
        - "log/level-mismatch fires twice: the info 'payment failed …' line and the error 'worker started' line"
        - "log/sensitive-field fires once for field password; log/interpolated-message fires twice (one f-string, one percent-format); log/exception-without-traceback fires once (logger.error in an except with no exc_info); the logger.exception call and the exc_info=True call draw nothing"
        - "tool.properties: calls 11, levels include info and error, fields list user_id with canonical user.id and order_id with canonical order.id, templates contains 'order priced'"
        - "warnings are ordered before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted spelling drift is found with its counts.
  - name: mutation-fixture-inconsistent-field
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/planted-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "a log/inconsistent-field-name result exists with properties.canonical user.id and variants {user_id: 2, userId: 1, uid: 1}, level warning"
        - "output validates against kit/shapes/finding-list.schema.json"

  # A conventions file without the user.id row stops the spelling finding: the taxonomy is a parameter.
  - name: boundary-custom-conventions
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/planted-src --conventions evals/fixtures/conventions-minimal.json"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "no log/inconsistent-field-name result (user_id, userId, uid are unmapped and distinct); log/sensitive-field still fires (password stays in the sensitive list)"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): no logging calls -> empty results and an empty inventory.
  - name: boundary-empty-tree
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/empty-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.calls is 0 and fields is empty"

  # Consistent logging draws nothing.
  - name: boundary-clean-tree
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/clean-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.calls is 3"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-source
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/broken-src"
    expected:
      kind: failure
      failureCode: source-unparseable
      assertions:
        - "exit code is 1 and stderr names broken.py and says source-unparseable"

  - name: boundary-invalid-conventions
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/planted-src --conventions evals/fixtures/planted-src/app.py"
    expected:
      kind: failure
      failureCode: conventions-invalid
      assertions:
        - "exit code is 1 and stderr says conventions-invalid"

  - name: boundary-invalid-path
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/planted-src/app.py"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the path is a file, not a directory"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/inventory_logs.py evals/fixtures/planted-src | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
