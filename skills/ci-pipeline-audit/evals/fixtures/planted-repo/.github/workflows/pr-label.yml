# Planted fixture: pull_request_target checking out the PR head.
name: Label
on:
  pull_request_target:
    types: [opened]
concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./scripts/label.sh
