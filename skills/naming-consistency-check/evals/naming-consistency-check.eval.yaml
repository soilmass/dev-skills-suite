# Table-driven eval file for naming-consistency-check (SDS-S-090).
#
# A rung-1 Query Skill over a planted snake_case tree carrying one
# deviant of each kind (constant, class, function with a camelCase
# argument, a two-letter function with one-letter arguments) beside a
# clean module, plus a consistently camelCase tree that must draw no
# mixed-convention finding — the check reports deviation from the
# tree, not from PEP 8. Every row is deterministic and offline.

skill: naming-consistency-check

rows:
  # REQUIRED — happy path (SDS-S-099): exactly the planted deviants are reported, with the tree's dominant styles.
  - name: happy-path-planted-deviants
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/planted-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "tool.properties.dominant is constant UPPER_CASE, class CapWords, function snake_case, argument snake_case"
        - "naming/mixed-convention names exactly default_limit (constant), order_batch (class), fetchOrders (function), customerId (argument); all warnings"
        - "naming/ambiguous-short-name names lo, hi, f, x, y and not the comprehension's n or the lambda's v; all info"
        - "no finding points at clean.py; warnings are ordered before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted camelCase function is found on its own line.
  - name: mutation-fixture-planted-camel-function
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/planted-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "a naming/mixed-convention result exists with properties.name fetchOrders, kind function, style camelCase, dominant snake_case, votes snake_case 6 / camelCase 1, at orders.py line 35"
        - "output validates against kit/shapes/finding-list.schema.json"

  # The convention is the tree's, not PEP 8: a consistently camelCase tree draws nothing.
  - name: boundary-consistent-camel-tree
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/camel-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "tool.properties.dominant.function is camelCase and results is empty"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): no Python files -> empty results and no dominant styles.
  - name: boundary-empty-tree
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/empty-src"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array and tool.properties.dominant is empty; the output is otherwise complete and schema-valid"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast): a syntax error stops the scan.
  - name: boundary-malformed-source
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/broken-src"
    expected:
      kind: failure
      failureCode: source-unparseable
      assertions:
        - "exit code is 1 and stderr names broken.py and says source-unparseable"

  - name: boundary-invalid-path
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/planted-src/clean.py"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the path is a file, not a directory"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/check_naming.py evals/fixtures/planted-src | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
