# Table-driven eval file for alert-fatigue-audit (SDS-S-090).
#
# A rung-1 Query Skill over a planted thirty-day Alertmanager-shaped
# history (one alertname per noise pattern, one healthy alert that must
# stay silent, one firing outside the window) and a Prometheus rules
# file with a never-firing rule. The clock is injected with --as-of
# (SDS-S-064). Every row is deterministic and offline.

skill: alert-fatigue-audit

rows:
  # REQUIRED — happy path (SDS-S-099): exactly the planted patterns are reported.
  - name: happy-path-planted-history
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-planted.json --as-of 2026-09-05T12:00:00Z --rules evals/fixtures/rules.yml"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "alert/never-acknowledged names exactly NoisyCron (8 firings, 0 acknowledged); not DiskAlmostFull (acknowledged twice) and not the healthy HighErrorRate"
        - "alert/flapping names exactly DiskAlmostFull (14 firings, medianMinutes 2.0)"
        - "alert/always-firing names exactly CertExpiringSoon with openDays 12"
        - "alert/no-runbook names exactly NoisyCron and DiskAlmostFull; HighErrorRate has a runbook_url in its annotations and CertExpiringSoon has one in its rule"
        - "alert/co-firing names the pair [DiskAlmostFull, DiskIOSaturated] with overlapRatio 1.0; alert/silent-rule names exactly DeploymentStuck (never fired)"
        - "tool.properties: windowDays 30, alertnames 5, firings 40 — the AncientAlert firing 40 days ago is outside the window and not counted"
        - "warnings are ordered before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted flapping alert is found with its numbers.
  - name: mutation-fixture-flapping-alert
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-planted.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "an alert/flapping result exists with properties.alertname DiskAlmostFull, firings 14, medianMinutes 2.0, level warning"
        - "output validates against kit/shapes/finding-list.schema.json"

  # The window is a parameter: with 3 days almost nothing is in scope.
  - name: boundary-short-window
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-planted.json --as-of 2026-09-05T12:00:00Z --window-days 3"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "no alert/flapping or alert/never-acknowledged result (too few firings in 3 days); alert/always-firing for CertExpiringSoon is gone too, since its start is outside the window"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): a quiet history -> empty results.
  - name: boundary-empty-quiet-history
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-quiet.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array (two acknowledged firings of one alert with a runbook); tool.properties.alertnames is 1"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-history
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-malformed.json --as-of 2026-09-05T12:00:00Z"
    expected:
      kind: failure
      failureCode: alerts-unparseable
      assertions:
        - "exit code is 1 and stderr says alerts-unparseable"

  - name: boundary-malformed-rules
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-planted.json --as-of 2026-09-05T12:00:00Z --rules evals/fixtures/alerts-malformed.json"
    expected:
      kind: failure
      failureCode: rules-unparseable
      assertions:
        - "exit code is 1 and stderr says rules-unparseable"

  - name: boundary-missing-as-of
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-planted.json"
    expected:
      kind: failure
      failureCode: as-of-invalid
      assertions:
        - "exit code is 1 and stderr says --as-of is required (as-of-invalid)"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/audit_alerts.py evals/fixtures/alerts-planted.json --as-of 2026-09-05T12:00:00Z --rules evals/fixtures/rules.yml | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
