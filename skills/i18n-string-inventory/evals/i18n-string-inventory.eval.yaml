# Table-driven eval file for i18n-string-inventory (SDS-S-090).
#
# A rung-1 Query Skill over a planted tree — Python and JavaScript
# modules calling the default translate functions, one dynamic call —
# and a catalogs directory with a nested base catalog, a partial German
# catalog with a placeholder mismatch, and a complete French one; plus
# a consistent pair that must stay silent. Every row is deterministic
# and offline.

skill: i18n-string-inventory

rows:
  # REQUIRED — happy path (SDS-S-099): every planted gap is reported; the consistent parts draw nothing.
  - name: happy-path-planted-catalogs
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/planted-repo/locales"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "i18n/missing-key for checkout.pay (2 references, located at the first by path: app/checkout.py line 6); i18n/unused-key for nav.about (in en.json, referenced nowhere) — nav.home, nav.cart, cart.items, checkout.title are all referenced (nested en.json flattened to dotted keys)"
        - "i18n/untranslated for de (missing [checkout.title, nav.cart], coverage 0.6); no untranslated finding for fr (complete); i18n/placeholder-mismatch for de cart.items ({{count}} vs {count})"
        - "i18n/dynamic-key for the t(`status.${s}`) call in web/status.js; tool.properties: base en, locales [de, en, fr], baseKeys 5, referencedKeys 5, dynamicCalls 1, coverage de 0.6 / fr 1.0; errors before warnings before infos"

  # REQUIRED for audit/finder skills — mutation fixture (SDS-S-095): the planted missing key is found at its first reference.
  - name: mutation-fixture-missing-key
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/planted-repo/locales"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "an i18n/missing-key result exists at app/checkout.py line 6 with properties.key checkout.pay and references 2, level error"
        - "output validates against kit/shapes/finding-list.schema.json"

  # The base locale is a parameter: with fr as base, en becomes a translation and nav.about is unused there too.
  - name: boundary-other-base
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/planted-repo/locales --base fr"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "tool.properties.base is fr; i18n/untranslated for de (fr has the same five keys); no untranslated finding for en"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): code and catalogs in agreement -> empty results.
  - name: boundary-empty-consistent
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/consistent-repo --catalogs evals/fixtures/consistent-repo/locales"
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "runs[0].results is an empty array; tool.properties.coverage is 1.0 for de"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-catalog
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/broken-locales"
    expected:
      kind: failure
      failureCode: catalog-unparseable
      assertions:
        - "exit code is 1 and stderr names en.json and says catalog-unparseable"

  - name: boundary-missing-base-catalog
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/planted-repo/locales --base ja"
    expected:
      kind: failure
      failureCode: catalog-missing
      assertions:
        - "exit code is 1 and stderr says catalog-missing and lists the locales found"

  - name: boundary-malformed-source
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/broken-repo --catalogs evals/fixtures/planted-repo/locales"
    expected:
      kind: failure
      failureCode: source-unparseable
      assertions:
        - "exit code is 1 and stderr names broken.py and says source-unparseable"

  - name: boundary-invalid-path
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo/web/checkout.js --catalogs evals/fixtures/planted-repo/locales"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the repository path is a file"

  - name: boundary-invalid-patterns
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/planted-repo/locales --patterns evals/fixtures/bad-patterns.json"
    expected:
      kind: failure
      failureCode: patterns-invalid
      assertions:
        - "exit code is 1 and stderr says patterns-invalid (the file has no translateFunctions key)"

  # N/A — shape-out finding-list != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out finding-list differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): SARIF-compatible for any downstream finding-list consumer.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/inventory_i18n.py evals/fixtures/planted-repo --catalogs evals/fixtures/planted-repo/locales | python3 -c \"import json,sys,jsonschema; d=json.load(sys.stdin); jsonschema.validate(d, json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('finding-list OK', len(d['runs'][0]['results']))\""
    expected:
      kind: success
      shape: finding-list
      assertions:
        - "the actual output validates against kit/shapes/finding-list.schema.json"
