# Table-driven eval file for onboarding-doc-generator (SDS-S-090).
#
# A rung-4 Command Skill whose render script checks an onboarding
# specification against a frozen repository-orientation facts object
# (evals/fixtures/frozen-repository-orientation-facts.json, recorded
# from that skill's own planted repository — a consumer-driven contract,
# SDS-C-063) and renders the guide. Write-mode rows render into the
# gitignored evals/fixtures/onboarding-out/, reset by
# build-onboarding-out.sh (SDS-S-096). Every row is deterministic and
# offline.

skill: onboarding-doc-generator

rows:
  # REQUIRED — happy path (SDS-S-099): a complete, verified guide renders with no warnings.
  - name: happy-path-dry-run
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures --facts-file evals/fixtures/frozen-repository-orientation-facts.json --dry-run"
    expected:
      kind: success
      assertions:
        - "setupSteps is 3 and warnings is empty (make test is declared and run; CI is mentioned; lastVerified is set)"
        - "rendered contains '## Access you need first', three '### N.' setup headings each followed by **You should see:**, '## Your first task' with **Done when:**, and '## Who to ask'"
        - "rendered says 'Last followed end to end by a newcomer: 2026-08-20'; nothing was written (dry run)"

  # Happy path: real write.
  - name: happy-path-write-guide
    input:
      command: "evals/fixtures/build-onboarding-out.sh && python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures/onboarding-out --facts-file evals/fixtures/frozen-repository-orientation-facts.json"
    expected:
      kind: success
      assertions:
        - "evals/fixtures/onboarding-out/ONBOARDING.md exists and begins with '# Onboarding: shop'"

  # Boundary: a setup step with no verify is refused outright (SDS-C-019).
  - name: boundary-unverifiable-step
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-missing-verify.json --out-dir evals/fixtures --dry-run"
    expected:
      kind: failure
      failureCode: onboarding-incomplete
      assertions:
        - "exit code is 1 and stderr names setup step 2 and says onboarding-incomplete"

  # Boundary: access granted by "someone" is refused.
  - name: boundary-anonymous-grantor
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-anonymous.json --out-dir evals/fixtures --dry-run"
    expected:
      kind: failure
      failureCode: onboarding-incomplete
      assertions:
        - "exit code is 1 and stderr says the AWS access is granted by 'someone' and says onboarding-incomplete"

  # Boundary: a command the tree does not declare is refused.
  - name: boundary-undeclared-command
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-undeclared.json --out-dir evals/fixtures --facts-file evals/fixtures/frozen-repository-orientation-facts.json --dry-run"
    expected:
      kind: failure
      failureCode: command-undeclared
      assertions:
        - "exit code is 1 and stderr names 'make bootstrap', lists the declared targets (lint, test), and says command-undeclared"

  # Unverified guide without facts: succeeds with the two honest warnings.
  - name: boundary-no-facts-unverified
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-unverified.json --out-dir evals/fixtures --dry-run"
    expected:
      kind: success
      assertions:
        - "warnings has exactly two entries: commands not checked (no --facts-file) and lastVerified absent; rendered says nobody has yet followed this guide end to end"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-spec
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-malformed.json --out-dir evals/fixtures --dry-run"
    expected:
      kind: failure
      failureCode: onboarding-unparseable
      assertions:
        - "exit code is 1 and stderr says onboarding-unparseable"

  # REQUIRED — boundary: empty/minimal input (SDS-C-005): a guide with nobody to ask fails the shape.
  - name: boundary-empty-who-to-ask
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-invalid.json --out-dir evals/fixtures --dry-run"
    expected:
      kind: failure
      failureCode: onboarding-invalid
      assertions:
        - "exit code is 1 and stderr names whoToAsk and says onboarding-invalid"

  - name: boundary-missing-out-dir
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures/onboarding-good.json --dry-run"
    expected:
      kind: failure
      failureCode: out-dir-missing
      assertions:
        - "exit code is 1 — the --out-dir argument is a file, not a directory"

  - name: boundary-malformed-facts
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures --facts-file evals/fixtures/onboarding-malformed.json --dry-run"
    expected:
      kind: failure
      failureCode: facts-unparseable
      assertions:
        - "exit code is 1 and stderr says facts-unparseable"

  # REQUIRED — consumer-driven contract with a second upstream producer (SDS-C-063): env-var-inventory's real finding-list
  # (frozen recording) names DATABASE_URL, API_BASE and SENTRY_DSN as required; the good guide mentions none, so the render warns for each.
  - name: contract-with-env-var-inventory
    input:
      command: "python3 -c \"import json,jsonschema; jsonschema.validate(json.load(open('evals/fixtures/frozen-env-var-inventory-report.json')), json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/finding-list.schema.json'))); print('env report OK')\" && python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures --facts-file evals/fixtures/frozen-repository-orientation-facts.json --env-file evals/fixtures/frozen-env-var-inventory-report.json --dry-run | python3 -c \"import json,sys; w=json.load(sys.stdin)['warnings']; assert any('DATABASE_URL' in x for x in w) and not any('LOG_LEVEL' in x for x in w), w; print('pipe OK')\""
    expected:
      kind: success
      assertions:
        - "the frozen env-var-inventory report validates as finding-list; the render warns that DATABASE_URL (and the other required reads, API_BASE and SENTRY_DSN) is mentioned in no step, and not about LOG_LEVEL (it has a default)"

  - name: boundary-malformed-env-file
    input:
      command: "python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures --env-file evals/fixtures/onboarding-good.json --dry-run"
    expected:
      kind: failure
      failureCode: env-unparseable
      assertions:
        - "exit code is 1 — an onboarding spec is not env-var-inventory output — and stderr says env-unparseable"

  # N/A — shape-out is freeform, not finding-list (SDS-S-095).
  - name: mutation-fixture
    expected:
      kind: not-applicable
      reason: "onboarding-doc-generator does not search for known problems; shape-out is freeform."

  # N/A — freeform/freeform is not a self-composability signal (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out and shape-in are both freeform; per SDS-S-094 that is not self-composability, and a rendered guide is not an input to this skill."

  # REQUIRED — contract (SDS-C-063): the frozen facts file is real repository-orientation output and validates against that skill's schema; this skill consumes it unchanged.
  - name: contract-with-repository-orientation
    input:
      command: "python3 -c \"import json,jsonschema; jsonschema.validate(json.load(open('evals/fixtures/frozen-repository-orientation-facts.json')), json.load(open('$(git rev-parse --show-toplevel)/skills/repository-orientation/assets/orientation.schema.json'))); print('facts OK')\" && python3 scripts/render_onboarding.py evals/fixtures/onboarding-good.json --out-dir evals/fixtures --facts-file evals/fixtures/frozen-repository-orientation-facts.json --dry-run"
    expected:
      kind: success
      assertions:
        - "the frozen facts validate against skills/repository-orientation/assets/orientation.schema.json and the render accepts them with no warnings"
