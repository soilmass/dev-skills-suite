# Table-driven eval file for upgrade-risk-assessor (SDS-S-090).
#
# A rung-1 Query Skill over a planted tree that imports `requests` in
# two modules (and `httpx` in none) and a planted changelog whose 3.0.0
# section names one symbol the tree uses. The changelog is injected as
# a file (SDS-S-065); nothing is fetched or installed. Every row is
# deterministic and offline.

skill: upgrade-risk-assessor

rows:
  # REQUIRED — happy path (SDS-S-099): a major jump whose changelog names a used symbol -> high, with the evidence.
  - name: happy-path-major-with-used-breaking-symbol
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 3.0.0 --changelog-file evals/fixtures/requests-changelog.md"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is high; justification names requests.Session.mount"
        - "facts.jump is major; facts.importingModules is exactly [app/http.py, app/upload.py]; facts.usedSymbols contains requests.Session, requests.Session.mount (through the local `s = requests.Session()`), requests.get, requests.post and not requests.delete"
        - "facts.breakingLines has 3 entries: two from the 3.0.0 section and the 2.32.0 section's 'deprecated' line (within the range); the 2.30.0 section's line is not included; exactly one carries usedSymbols, [requests.Session, requests.Session.mount] — `get` does not match get_encodings_from_content"
        - "consequences.negative has two entries, for requests.Session and requests.Session.mount"

  # Same tree, a minor jump whose range carries only a "deprecated" line -> medium (read it), not low.
  - name: boundary-minor-clean-changelog
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 2.32.0 --changelog-file evals/fixtures/requests-changelog.md"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is medium — the 2.32.0 section carries a 'deprecated' line, which counts as a breaking line even though it names nothing the tree uses; justification says none names a used symbol"

  - name: boundary-patch-no-changelog
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 2.31.1"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is low; justification says no changelog was supplied and the claim rests on semver alone; decisionDrivers says changelog: not supplied"

  - name: boundary-major-no-changelog
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 3.0.0"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is medium; justification says no changelog was supplied so the breaking changes are unknown"

  - name: boundary-prerelease-target
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 2.32.0rc1"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is medium and facts.jump is prerelease"

  - name: boundary-downgrade
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 2.28.0"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is downgrade"

  # REQUIRED — boundary: empty input (SDS-C-005, SDS-C-033): a package nothing imports -> unused, a valid decision-doc with empty facts.
  - name: boundary-empty-usage-unused-package
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package httpx --from 0.27.0 --to 1.0.0"
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "chosenOption is unused; facts.importingModules and facts.usedSymbols are empty"

  # REQUIRED — boundary: malformed input (SDS-C-019 fail-fast).
  - name: boundary-malformed-version
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from latest --to 3.0.0"
    expected:
      kind: failure
      failureCode: version-invalid
      assertions:
        - "exit code is 1 and stderr says version-invalid"

  - name: boundary-missing-changelog
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 3.0.0 --changelog-file evals/fixtures/planted-repo"
    expected:
      kind: failure
      failureCode: changelog-unreadable
      assertions:
        - "exit code is 1 — a directory cannot be read as a changelog — and stderr says changelog-unreadable"

  - name: boundary-malformed-source
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/broken-repo --package requests --from 2.31.0 --to 3.0.0"
    expected:
      kind: failure
      failureCode: source-unparseable
      assertions:
        - "exit code is 1 and stderr names broken.py and says source-unparseable"

  - name: boundary-invalid-repo-path
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/requests-changelog.md --package requests --from 2.31.0 --to 3.0.0"
    expected:
      kind: failure
      failureCode: repo-invalid
      assertions:
        - "exit code is 1 — the repository path is a file"

  # N/A — shape-out is decision-doc, not finding-list (SDS-S-095).
  - name: mutation-fixture
    expected:
      kind: not-applicable
      reason: "upgrade-risk-assessor does not search for known problems; shape-out is decision-doc."

  # N/A — shape-out decision-doc != shape-in freeform (SDS-S-094).
  - name: fixed-point
    expected:
      kind: not-applicable
      reason: "shape-out decision-doc differs from shape-in freeform; the skill is not self-composable."

  # REQUIRED — contract (SDS-C-063): the decision-doc migration-plan-writer can consume validates against the registered shape.
  - name: contract-with-downstream-consumer
    input:
      command: "python3 scripts/assess_upgrade.py evals/fixtures/planted-repo --package requests --from 2.31.0 --to 3.0.0 --changelog-file evals/fixtures/requests-changelog.md | python3 -c \"import json,sys,jsonschema; jsonschema.validate(json.load(sys.stdin), json.load(open('$(git rev-parse --show-toplevel)/kit/shapes/decision-doc.schema.json'))); print('decision-doc OK')\""
    expected:
      kind: success
      shape: decision-doc
      assertions:
        - "the actual output validates against kit/shapes/decision-doc.schema.json"
